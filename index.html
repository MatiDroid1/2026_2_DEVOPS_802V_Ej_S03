<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planilla simple</title>
    <style>
      :root {
        --bg: #f3f3f3;
        --panel: #ffffff;
        --line: #d6d6d6;
        --text: #222222;
        --muted: #666666;
        --head: #f0f0f0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .contenedor {
        max-width: 900px;
        margin: 32px auto;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 20px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th, td {
        border: 1px solid var(--line);
        padding: 10px 8px;
        text-align: left;
      }

      th {
        background: var(--head);
        font-weight: 600;
      }

      .numero {
        text-align: right;
      }

      .total-row td {
        font-weight: 700;
        background: #fafafa;
      }

      .total-row td:last-child {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h1>Planilla</h1>

      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Lapicera</td>
            <td class="numero"><input type="number" value="2" min="0" /></td>
            <td class="numero"><input type="number" value="4.5" min="0" step="0.1" /></td>
            <td class="numero total-celda">9.00</td>
          </tr>
          <tr>
            <td>Cuaderno</td>
            <td class="numero"><input type="number" value="3" min="0" /></td>
            <td class="numero"><input type="number" value="7.5" min="0" step="0.1" /></td>
            <td class="numero total-celda">22.50</td>
          </tr>
          <tr>
            <td>Tinta</td>
            <td class="numero"><input type="number" value="1" min="0" /></td>
            <td class="numero"><input type="number" value="12" min="0" step="0.1" /></td>
            <td class="numero total-celda">12.00</td>
          </tr>
          <tr class="total-row">
            <td colspan="3">Total</td>
            <td id="total-general">43.50</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      const rows = document.querySelectorAll('tbody tr:not(.total-row)');
      const totalGeneral = document.getElementById('total-general');

      function actualizarTotales() {
        let total = 0;

        rows.forEach((row) => {
          const inputs = row.querySelectorAll('input');
          const cantidad = Number(inputs[0].value) || 0;
          const precio = Number(inputs[1].value) || 0;
          const subtotal = cantidad * precio;
          row.querySelector('.total-celda').textContent = subtotal.toFixed(2);
          total += subtotal;
        });

        totalGeneral.textContent = total.toFixed(2);
      }

      document.querySelectorAll('input').forEach((input) => {
        input.addEventListener('input', actualizarTotales);
      });

      actualizarTotales();
    </script>
  </body>
</html>
